<!DOCTYPE html>
<html>
<head>
    <title>Lost Items</title>
</head>

<body>

    <h1>Lost Items</h1>

    <form method="GET">

    <input
        type="text"
        name="search"
        placeholder="Search item"
        value="{{ search }}"
    >

    <input
        type="text"
        name="category"
        placeholder="Category"
        value="{{ category }}"
    >

    <input
        type="text"
        name="location"
        placeholder="Location"
        value="{{ location }}"
    >

    <button type="submit">
        Search
    </button>

</form>

<hr><hr>

    {% if items %}

        {% for item in items %}

            <div>
                <h2>{{ item.name }}</h2>

                <p>Category: {{ item.category }}</p>

                <p>Location: {{ item.location }}</p>

                <a href="{{ url_for('main.item_detail', item_id=item.id) }}">
                View Details
                </a>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No lost items have been reported yet.</p>

    {% endif %}

</body>
</html>
