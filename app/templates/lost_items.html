<!DOCTYPE html>
<html>
<head>
    <title>Lost Items</title>
</head>

<body>

    <h1>Lost Items</h1>

    {% if items %}

        {% for item in items %}

            <div>
                <h2>{{ item.name }}</h2>

                <p>Category: {{ item.category }}</p>

                <p>Location: {{ item.location }}</p>

                <p>Description: {{ item.description }}</p>

                <p>Reported by: {{ item.reporter.name }}</p>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No lost items have been reported yet.</p>

    {% endif %}

</body>
</html>
