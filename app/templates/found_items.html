<!DOCTYPE html>
<html>
<head>
    <title>Found Items</title>
</head>

<body>

    <h1>Found Items</h1>

    {% if items %}

        {% for item in items %}

            <div>
                <h2>{{ item.name }}</h2>

                <p>Category: {{ item.category }}</p>

                <p>Location: {{ item.location }}</p>

                <a href="{{ url_for('main.item_detail', item_id=item.id) }}">
                View Details
                </a>
                
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No found items have been reported yet.</p>

    {% endif %}

</body>
</html>
